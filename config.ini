# ===============================================================================
# CONFIGURATION FOR TAMIL HOROSCOPE POSTGRESQL INGESTION
# ===============================================================================

[database]
# Local or Remote PostgreSQL Database Settings
host = localhost
port = 5432
dbname = vedic_astro
user = postgres
password = postgres

[pdf]
# Path to your Tamil Horoscope PDF (e.g., horoscope.pdf or /path/to/horoscope.pdf)
pdf_path = horoscope.pdf

[options]
# Set dry_run = false to insert directly into PostgreSQL
# Set dry_run = true to test without connecting to database
dry_run = false

# Export generated SQL insert dump to file (leave blank to disable)
export_sql = scripts/insert_001ME.sql

# Export parsed records to JSON format (leave blank to disable)
export_json = scripts/extracted_001ME.json
